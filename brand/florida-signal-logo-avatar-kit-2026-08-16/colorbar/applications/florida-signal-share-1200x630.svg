<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Florida Signal — Development intelligence before the headline</title>
  <desc id="desc">Aerial view of Fort Lauderdale waterfront neighborhoods with Florida Signal branding and the words Development intelligence before the headline.</desc>
  <defs>
    <linearGradient id="navy-wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#071b2e" stop-opacity="1"></stop>
      <stop offset="0.5" stop-color="#071b2e" stop-opacity="1"></stop>
      <stop offset="0.78" stop-color="#071b2e" stop-opacity="0.55"></stop>
      <stop offset="1" stop-color="#071b2e" stop-opacity="0.1"></stop>
    </linearGradient>
    <linearGradient id="edge-wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061a2e" stop-opacity="0.15"></stop>
      <stop offset="0.68" stop-color="#061a2e" stop-opacity="0"></stop>
      <stop offset="1" stop-color="#061a2e" stop-opacity="0.52"></stop>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#061a2e"></rect>
  <image href="../photos/fort-lauderdale-waterfront-neighborhoods-aerial-adobe-428926084.jpg" width="1200" height="630" preserveAspectRatio="xMidYMid slice"></image>
  <rect width="1200" height="630" fill="url(#navy-wash)"></rect>
  <rect width="1200" height="630" fill="url(#edge-wash)"></rect>

  
  <image href="./lockups/fs-lockup-compact-reverse-colorbar-2470.png" x="64" y="50" width="470" height="99" preserveAspectRatio="xMinYMid meet"></image>

  <text x="68" y="300" fill="#ffffff" font-family="Georgia, Times New Roman, serif" font-size="62" font-weight="400">Development intelligence</text>
  <text x="68" y="372" fill="#ffffff" font-family="Georgia, Times New Roman, serif" font-size="62" font-weight="400">before the headline.</text>

  <rect y="618" width="1200" height="12" fill="#1f6fff"></rect>
  <rect x="936" y="618" width="264" height="12" fill="#32c7dc"></rect>
</svg>