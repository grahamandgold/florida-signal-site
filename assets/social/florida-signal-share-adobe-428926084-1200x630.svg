<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Florida Signal — Development intelligence before the headline</title>
  <desc id="desc">Aerial view of Fort Lauderdale waterfront neighborhoods with Florida Signal branding and the words Development intelligence before the headline.</desc>
  <defs>
    <linearGradient id="navy-wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#071b2e" stop-opacity="1"/>
      <stop offset="0.42" stop-color="#071b2e" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#071b2e" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#071b2e" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="edge-wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061a2e" stop-opacity="0.15"/>
      <stop offset="0.68" stop-color="#061a2e" stop-opacity="0"/>
      <stop offset="1" stop-color="#061a2e" stop-opacity="0.52"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#061a2e"/>
  <image href="../photos/fort-lauderdale-waterfront-neighborhoods-aerial-adobe-428926084.jpg" width="1200" height="630" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1200" height="630" fill="url(#navy-wash)"/>
  <rect width="1200" height="630" fill="url(#edge-wash)"/>

  <rect width="1200" height="170" fill="#ffffff"/>
  <line x1="0" y1="169" x2="1200" y2="169" stroke="#dbe5ec"/>
  <!-- Exact approved Claude landing-page lockup. Never reconstruct this artwork with live text or separate logo pieces. -->
  <image href="../../brand/florida-signal-logo-avatar-kit-2026-08-16/logos/fs-lockup-horizontal-transparent.png" x="-52" y="-68" width="678" height="291" preserveAspectRatio="xMidYMid meet"/>

  <text x="72" y="217" fill="#55d2e4" font-family="Courier New, monospace" font-size="14" font-weight="700" letter-spacing="3.2">BROWARD COUNTY</text>
  <text x="68" y="296" fill="#ffffff" font-family="Georgia, Times New Roman, serif" font-size="56" font-weight="400">Development intelligence</text>
  <text x="68" y="361" fill="#ffffff" font-family="Georgia, Times New Roman, serif" font-size="56" font-weight="400">before the headline.</text>

  <text x="72" y="556" fill="#d8e5ef" font-family="Courier New, monospace" font-size="14" font-weight="700" letter-spacing="2.1">THEFLORIDASIGNAL.COM</text>

  <rect y="618" width="1200" height="12" fill="#1f6fff"/>
  <rect x="936" y="618" width="264" height="12" fill="#32c7dc"/>
</svg>
